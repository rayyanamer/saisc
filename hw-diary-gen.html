<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Diary Image Maker — Superior Allama Iqbal Science College Gojra</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Google Fonts: Fraunces, Manrope & Gulzar for distinct editorial & Urdu styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Gulzar&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Manrope"', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['"Fraunces"', 'Georgia', 'serif'],
            urdu: ['"Gulzar"', 'serif'],
          },
          colors: {
            brandRed: '#D9232E',
            brandBlue: '#0EA5E9',
            brandNavy: '#0F172A',
          },
        },
      },
    };
  </script>
  <style>
    /* Smooth custom scrollbar for subject list on large screens */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Subtle dot pattern background for workspace */
    .workspace-bg {
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Neat, well-proportioned font styling for Urdu/Arabic input fields */
    textarea[dir="auto"]:lang(ur),
    textarea[dir="auto"] {
      font-family: "Manrope", "Gulzar", serif;
      line-height: 1.75;
    }
  </style>
</head>
<body class="workspace-bg min-h-screen text-slate-800 antialiased selection:bg-sky-100 selection:text-sky-900">
  <!-- Toast / Status Banner Container (replaces alert/confirm) -->
  <div
    id="statusBanner"
    role="status"
    aria-live="polite"
    class="fixed top-4 right-4 z-50 hidden max-w-sm rounded-2xl border px-4 py-3 text-sm font-medium shadow-xl transition-all duration-300"
  >
    <div class="flex items-start gap-3">
      <span id="statusIcon" class="mt-0.5 text-base"></span>
      <p id="statusText" class="leading-snug"></p>
    </div>
  </div>

  <!-- Top Application Header -->
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3.5 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-slate-50">
          <canvas id="miniLogoCanvas" width="32" height="32" class="rounded-full"></canvas>
        </div>
        <div>
          <h1 class="font-display text-base font-bold tracking-tight text-slate-900 sm:text-lg">
            Daily Diary Image Maker
          </h1>
          <p class="text-xs text-slate-500">
            Create &amp; download class diary cards
          </p>
        </div>
      </div>

      <!-- Quick Action Badges -->
      <div class="flex items-center gap-2">
        <button
          type="button"
          id="btnLoadSample"
          class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 transition hover:bg-slate-50 active:scale-[0.99]"
        >
          Sample
        </button>
        <button
          type="button"
          id="btnClearAll"
          class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 transition hover:bg-slate-50 active:scale-[0.99]"
        >
          Clear
        </button>
      </div>
    </div>
  </header>

  <!-- Main Responsive Two-Column Workspace -->
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-12 lg:items-start">
      <!-- LEFT COLUMN: Diary Input Form (6 cols on lg) -->
      <section
        aria-label="Diary Entry Form"
        class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 lg:col-span-6"
      >
        <div class="mb-5 flex items-center justify-between gap-2 border-b border-slate-100 pb-3.5">
          <h2 class="font-display text-base font-bold text-slate-900">
            Diary Details
          </h2>
          <span id="filledCountBadge" class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-600">
            0 of 9 filled
          </span>
        </div>

        <!-- Date & Class Section -->
        <div class="mb-5 grid grid-cols-1 gap-4 sm:grid-cols-2">
          <!-- Present Date -->
          <div>
            <label for="diaryDate" class="mb-1.5 block text-xs font-semibold text-slate-600">
              Date
            </label>
            <input
              type="date"
              id="diaryDate"
              class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 transition focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/5"
            />
          </div>

          <!-- Selected Class -->
          <div>
            <label for="diaryClass" class="mb-1.5 block text-xs font-semibold text-slate-600">
              Class / Section
            </label>
            <div class="flex gap-2">
              <select
                id="diaryClass"
                class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 transition focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/5"
              >
                <option value="9th Class (Science)">9th Class (Science)</option>
                <option value="10th Class (Science)">10th Class (Science)</option>
                <option value="1st Year (F.Sc Pre-Medical)">1st Year (F.Sc Pre-Medical)</option>
                <option value="1st Year (F.Sc Pre-Engineering)">1st Year (F.Sc Pre-Engineering)</option>
                <option value="1st Year (ICS)">1st Year (ICS)</option>
                <option value="2nd Year (F.Sc Pre-Medical)">2nd Year (F.Sc Pre-Medical)</option>
                <option value="2nd Year (F.Sc Pre-Engineering)">2nd Year (F.Sc Pre-Engineering)</option>
                <option value="2nd Year (ICS)">2nd Year (ICS)</option>
                <option value="8th Class">8th Class</option>
                <option value="CUSTOM">Custom Class...</option>
              </select>
            </div>
            <input
              type="text"
              id="customClassInput"
              placeholder="Enter custom class (e.g. 10th Blue - Boys)"
              class="mt-2 hidden w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:border-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/5"
            />
          </div>
        </div>

        <!-- Campus Logo Option (Defaults to logo.jpeg in root directory) -->
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50/60 px-3.5 py-2.5">
          <div class="flex items-center gap-3">
            <div class="h-10 w-10 shrink-0 overflow-hidden rounded-full border border-slate-200 bg-white">
              <canvas id="logoPreviewCanvas" width="80" height="80" class="h-full w-full object-cover"></canvas>
            </div>
            <div>
              <p class="text-xs font-semibold text-slate-800">Campus Logo</p>
              <p id="logoSourceLabel" class="text-[11px] text-slate-500">
                logo.jpeg
              </p>
            </div>
          </div>

          <div class="flex items-center gap-1.5">
            <label
              for="logoUploadInput"
              class="cursor-pointer rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-medium text-slate-700 transition hover:bg-slate-50"
            >
              Change
            </label>
            <input type="file" id="logoUploadInput" accept="image/*" class="hidden" />
            <button
              type="button"
              id="btnResetLogo"
              class="rounded-lg px-2 py-1.5 text-xs font-medium text-slate-500 transition hover:bg-slate-100 hover:text-slate-800"
            >
              Reset
            </button>
          </div>
        </div>

        <!-- Subject-Wise Diary Fields -->
        <div class="mb-5">
          <div class="mb-2.5 flex items-center justify-between">
            <h3 class="text-xs font-semibold text-slate-600">
              Subjects
            </h3>
            <button
              type="button"
              id="btnAddSubject"
              class="rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-xs font-medium text-slate-700 transition hover:bg-slate-50"
            >
              + Add Subject
            </button>
          </div>

          <div id="subjectsContainer" class="space-y-3">
            <!-- Dynamically populated subject input cards -->
          </div>
        </div>

        <!-- Optional Note / Remarks Field -->
        <div class="mb-5">
          <label for="generalNote" class="mb-1.5 block text-xs font-semibold text-slate-600">
            Notice (Optional)
          </label>
          <input
            type="text"
            id="generalNote"
            placeholder="e.g. Monthly test starts Monday."
            class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400 transition focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/5"
          />
        </div>

        <!-- Primary Create & Download Action Buttons -->
        <div class="flex flex-col gap-2.5 sm:flex-row">
          <button
            type="button"
            id="btnCreateDiary"
            class="flex flex-1 items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 transition hover:bg-slate-50 active:scale-[0.99]"
          >
            <span>Create Image</span>
          </button>

          <button
            type="button"
            id="btnDownloadDiary"
            class="flex flex-1 items-center justify-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800 active:scale-[0.99]"
          >
            <span>Download PNG</span>
          </button>
        </div>
      </section>

      <!-- RIGHT COLUMN: Live / Generated Diary Image Preview (6 cols on lg for landscape preview) -->
      <section
        aria-label="Generated Diary Preview"
        class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 lg:sticky lg:top-6 lg:col-span-6"
      >
        <div class="mb-3.5 flex items-center justify-between gap-2 border-b border-slate-100 pb-3">
          <h2 class="font-display text-base font-bold text-slate-900">
            Preview
          </h2>
          <button
            type="button"
            id="btnDownloadSecondary"
            class="text-xs font-semibold text-slate-600 underline decoration-slate-300 underline-offset-4 transition hover:text-slate-900"
          >
            Save PNG
          </button>
        </div>

        <!-- Canvas Frame -->
        <div class="overflow-hidden rounded-xl border border-slate-200 bg-slate-100 p-2">
          <canvas
            id="diaryCanvas"
            class="h-auto w-full rounded-lg bg-white"
          ></canvas>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      /**
       * =========================================================================
       * DAILY DIARY IMAGE MAKER — APPLICATION LOGIC & HIGH-DPI CANVAS RENDERER
       * =========================================================================
       * Architecture Overview:
       * 1. State Management: Holds date, selected class, custom class string,
       *    campus logo image (default high-res programmatic emblem matching
       *    Superior Allama Iqbal Science College Gojra, or user-uploaded image),
       *    optional notice, and array of subject entries.
       * 2. UI Builders: Dynamically renders subject rows, updates filled counters,
       *    and handles custom class toggles, logo uploads, sample presets, and clearing.
       * 3. Canvas Layout & Typography Engine: Measures wrapped text lines accurately
       *    before drawing so each subject card sizes dynamically with generous padding,
       *    crisp typography, brand accents (#D9232E red & #0EA5E9 sky blue), campus
       *    emblem, present date, and selected class.
       * 4. PNG Export & Feedback: Exports a crisp PNG file to the user's device.
       */

      // Default subjects separated clearly (Biology, Computer, Islamiat, Tarjuma-tul-Quran)
      const DEFAULT_SUBJECTS = [
        { id: "subj-1", name: "Physics", color: "#0284c7", badgeBg: "#e0f2fe", diary: "" },
        { id: "subj-2", name: "Chemistry", color: "#dc2626", badgeBg: "#fee2e2", diary: "" },
        { id: "subj-3", name: "Mathematics", color: "#4f46e5", badgeBg: "#e0e7ff", diary: "" },
        { id: "subj-4", name: "Biology", color: "#059669", badgeBg: "#d1fae5", diary: "" },
        { id: "subj-5", name: "Computer", color: "#0891b2", badgeBg: "#cffafe", diary: "" },
        { id: "subj-6", name: "English", color: "#d97706", badgeBg: "#fef3c7", diary: "" },
        { id: "subj-7", name: "Urdu", color: "#7c3aed", badgeBg: "#ede9fe", diary: "" },
        { id: "subj-8", name: "Islamiat", color: "#0d9488", badgeBg: "#ccfbf1", diary: "" },
        { id: "subj-9", name: "Tarjuma-tul-Quran", color: "#15803d", badgeBg: "#dcfce7", diary: "" },
      ];

      const SAMPLE_DIARIES = {
        Physics: "Chapter 5: Gravitation — Revise Newton's Law of Universal Gravitation and solve numerical problems 5.1 to 5.4 in notebooks.",
        Chemistry: "Chemical Equilibrium: Learn Law of Mass Action with examples; prepare short questions on reversible reactions for tomorrow's oral test.",
        Mathematics: "Exercise 4.2: Complete questions 1 to 8 (all parts) on algebraic fractions and quadratic equations.",
        Biology: "Cell Cycle & Mitosis: Draw neat labeled diagrams of Prophase and Metaphase; memorize key stages.",
        Computer: "Chapter 3: Networks & Topologies — Revise Star, Ring, and Mesh topologies with advantages and diagrams.",
        English: "Unit 7 (Sultan Ahmad Mosque): Read paragraphs 1–4, underline difficult words, and write meanings + sentences.",
        Urdu: "سبق کا خلاصہ اور تشریح یاد کریں، صفحہ نمبر 68 کی املا کے الفاظ لکھ کر لائیں۔",
        Islamiat: "باب سوم: سیرتِ طیبہ ﷺ — غزوہ بدر کے اسباب اور نتائج یاد کریں اور مختصر سوالات کاپی پر لکھیں۔",
        "Tarjuma-tul-Quran": "سورۃ البقرہ: رکوع نمبر 2 کی آیات کا با محاورہ ترجمہ اور مشکل الفاظ کے معانی یاد کریں۔",
      };

      const ACCENT_PALETTE = [
        { color: "#0284c7", badgeBg: "#e0f2fe" },
        { color: "#dc2626", badgeBg: "#fee2e2" },
        { color: "#4f46e5", badgeBg: "#e0e7ff" },
        { color: "#059669", badgeBg: "#d1fae5" },
        { color: "#0891b2", badgeBg: "#cffafe" },
        { color: "#d97706", badgeBg: "#fef3c7" },
        { color: "#7c3aed", badgeBg: "#ede9fe" },
        { color: "#0d9488", badgeBg: "#ccfbf1" },
        { color: "#15803d", badgeBg: "#dcfce7" },
        { color: "#be185d", badgeBg: "#fce7f3" },
      ];

      // Application State
      const state = {
        date: getTodayISO(),
        classSelection: "9th Class (Science)",
        customClass: "",
        generalNote: "",
        subjects: DEFAULT_SUBJECTS.map((s) => ({ ...s })),
        customLogoImg: null,
        logoLabel: "logo.jpeg",
      };

      // DOM References
      const els = {
        diaryDate: document.getElementById("diaryDate"),
        diaryClass: document.getElementById("diaryClass"),
        customClassInput: document.getElementById("customClassInput"),
        generalNote: document.getElementById("generalNote"),
        subjectsContainer: document.getElementById("subjectsContainer"),
        filledCountBadge: document.getElementById("filledCountBadge"),
        btnAddSubject: document.getElementById("btnAddSubject"),
        btnCreateDiary: document.getElementById("btnCreateDiary"),
        btnDownloadDiary: document.getElementById("btnDownloadDiary"),
        btnDownloadSecondary: document.getElementById("btnDownloadSecondary"),
        btnLoadSample: document.getElementById("btnLoadSample"),
        btnClearAll: document.getElementById("btnClearAll"),
        logoUploadInput: document.getElementById("logoUploadInput"),
        btnResetLogo: document.getElementById("btnResetLogo"),
        logoSourceLabel: document.getElementById("logoSourceLabel"),
        logoPreviewCanvas: document.getElementById("logoPreviewCanvas"),
        miniLogoCanvas: document.getElementById("miniLogoCanvas"),
        diaryCanvas: document.getElementById("diaryCanvas"),
        statusBanner: document.getElementById("statusBanner"),
        statusIcon: document.getElementById("statusIcon"),
        statusText: document.getElementById("statusText"),
      };

      let bannerTimer = null;

      /**
       * Returns today's local date formatted as YYYY-MM-DD for <input type="date">.
       */
      function getTodayISO() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      /**
       * Formats an ISO date string (YYYY-MM-DD) into a clean readable date string.
       */
      function formatDisplayDate(isoDate) {
        if (!isoDate) return "Date Not Set";
        const parts = isoDate.split("-");
        if (parts.length !== 3) return isoDate;
        const dateObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        if (Number.isNaN(dateObj.getTime())) return isoDate;
        return dateObj.toLocaleDateString("en-US", {
          weekday: "short",
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      /**
       * Resolves the active class name from dropdown or custom class input.
       */
      function getActiveClassName() {
        if (state.classSelection === "CUSTOM") {
          return state.customClass.trim() || "Custom Class";
        }
        return state.classSelection;
      }

      /**
       * Displays a non-blocking toast notification banner.
       */
      function showToast(message, type = "info") {
        if (bannerTimer) clearTimeout(bannerTimer);
        els.statusText.textContent = message;

        els.statusBanner.className =
          "fixed top-4 right-4 z-50 max-w-sm rounded-2xl border px-4 py-3 text-sm font-medium shadow-xl transition-all duration-300";

        if (type === "success") {
          els.statusBanner.classList.add("border-emerald-200", "bg-emerald-50", "text-emerald-900");
          els.statusIcon.textContent = "✓";
        } else if (type === "warn") {
          els.statusBanner.classList.add("border-amber-200", "bg-amber-50", "text-amber-900");
          els.statusIcon.textContent = "!";
        } else {
          els.statusBanner.classList.add("border-sky-200", "bg-sky-50", "text-sky-900");
          els.statusIcon.textContent = "ℹ";
        }

        els.statusBanner.classList.remove("hidden");
        bannerTimer = setTimeout(() => {
          els.statusBanner.classList.add("hidden");
        }, 3400);
      }

      /**
       * Draws a rounded rectangle path without immediately filling or stroking.
       */
      function roundRectPath(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      /**
       * Wraps multi-paragraph text into lines fitting within maxWidth.
       */
      function wrapTextLines(ctx, text, maxWidth) {
        if (!text) return [];
        const paragraphs = text.split(/\r?\n/);
        const allLines = [];

        paragraphs.forEach((para) => {
          const words = para.trim().split(/\s+/);
          if (!words[0]) {
            allLines.push("");
            return;
          }
          let currentLine = words[0];
          for (let i = 1; i < words.length; i++) {
            const word = words[i];
            const testLine = `${currentLine} ${word}`;
            if (ctx.measureText(testLine).width <= maxWidth) {
              currentLine = testLine;
            } else {
              allLines.push(currentLine);
              currentLine = word;
            }
          }
          allLines.push(currentLine);
        });

        return allLines;
      }

      /**
       * Draws either the user's uploaded campus logo or the high-resolution
       * Superior Allama Iqbal Science College Gojra circular crest.
       */
      function drawCampusLogo(ctx, size, customImg) {
        ctx.clearRect(0, 0, size, size);
        const cx = size / 2;
        const cy = size / 2;
        const r = size / 2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
        ctx.clip();

        if (customImg) {
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, size, size);
          const scale = Math.max(size / customImg.width, size / customImg.height);
          const drawW = customImg.width * scale;
          const drawH = customImg.height * scale;
          ctx.drawImage(customImg, (size - drawW) / 2, (size - drawH) / 2, drawW, drawH);
          ctx.restore();
          return;
        }

        // Outer Sky-Blue Ring
        ctx.fillStyle = "#0EA5E9";
        ctx.fillRect(0, 0, size, size);

        // White Separator Ring
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.87, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();

        // Inner Crimson-Red Medallion
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
        ctx.fillStyle = "#DC2626";
        ctx.fill();

        // Globe Latitude/Longitude Lines
        const globeR = r * 0.34;
        const globeY = cy - r * 0.06;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        ctx.lineWidth = Math.max(1.2, size * 0.01);
        ctx.beginPath();
        ctx.arc(cx, globeY, globeR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(cx, globeY, globeR * 0.52, globeR, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - globeR, globeY);
        ctx.lineTo(cx + globeR, globeY);
        ctx.moveTo(cx, globeY - globeR);
        ctx.lineTo(cx, globeY + globeR);
        ctx.stroke();

        // Stylized Soaring Shaheen / Eagle Silhouette
        ctx.save();
        ctx.translate(cx, globeY);
        ctx.rotate(-0.22);
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.moveTo(-globeR * 1.15, 0);
        ctx.quadraticCurveTo(-globeR * 0.4, -globeR * 0.48, 0, -globeR * 0.14);
        ctx.quadraticCurveTo(globeR * 0.45, -globeR * 0.55, globeR * 1.15, -globeR * 0.08);
        ctx.quadraticCurveTo(globeR * 0.45, globeR * 0.15, 0, globeR * 0.12);
        ctx.quadraticCurveTo(-globeR * 0.45, globeR * 0.18, -globeR * 1.15, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#92400E";
        ctx.beginPath();
        ctx.moveTo(-globeR * 1.0, 0);
        ctx.quadraticCurveTo(-globeR * 0.35, -globeR * 0.36, 0, -globeR * 0.09);
        ctx.quadraticCurveTo(globeR * 0.4, -globeR * 0.42, globeR * 1.0, -globeR * 0.05);
        ctx.quadraticCurveTo(globeR * 0.38, globeR * 0.08, 0, globeR * 0.07);
        ctx.quadraticCurveTo(-globeR * 0.38, globeR * 0.1, -globeR * 1.0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Supporting Hands Arc at Base of Globe
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = Math.max(1.8, size * 0.022);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(cx, globeY + r * 0.04, globeR * 1.18, 0.25 * Math.PI, 0.75 * Math.PI);
        ctx.stroke();

        // Circular Arched College Name
        const arcText = "SUPERIOR ALLAMA IQBAL SCIENCE COLLEGE GOJRA";
        const textRadius = r * 0.67;
        ctx.fillStyle = "#FFFFFF";
        ctx.font = `800 ${Math.max(6, Math.round(size * 0.068))}px "Fraunces", "Manrope", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const totalAngle = Math.PI * 1.32;
        const startAngle = -Math.PI / 2 - totalAngle / 2;
        const stepAngle = totalAngle / (arcText.length - 1);

        for (let i = 0; i < arcText.length; i++) {
          const angle = startAngle + i * stepAngle;
          ctx.save();
          ctx.translate(cx + Math.cos(angle) * textRadius, cy + Math.sin(angle) * textRadius);
          ctx.rotate(angle + Math.PI / 2);
          ctx.fillText(arcText[i], 0, 0);
          ctx.restore();
        }

        // Motto Text at Bottom
        ctx.font = `800 ${Math.max(5, Math.round(size * 0.058))}px "Fraunces", "Manrope", sans-serif`;
        ctx.fillText("EDUCATION WITH", cx, cy + r * 0.46);
        ctx.fillText("EXCELLENCE", cx, cy + r * 0.6);

        ctx.restore();
      }

      /**
       * Updates the mini header logo and form preview logo canvases.
       */
      function refreshLogoCanvases() {
        if (els.miniLogoCanvas) {
          drawCampusLogo(els.miniLogoCanvas.getContext("2d"), els.miniLogoCanvas.width, state.customLogoImg);
        }
        if (els.logoPreviewCanvas) {
          drawCampusLogo(els.logoPreviewCanvas.getContext("2d"), els.logoPreviewCanvas.width, state.customLogoImg);
        }
      }

      /**
       * Updates the badge showing how many subject diary fields are filled.
       */
      function updateFilledBadge() {
        const filled = state.subjects.filter((s) => s.diary.trim().length > 0).length;
        els.filledCountBadge.textContent = `${filled} of ${state.subjects.length} filled`;
      }

      /**
       * Renders the interactive subject cards inside the form column.
       */
      function renderSubjectInputs() {
        els.subjectsContainer.innerHTML = "";

        state.subjects.forEach((subj, index) => {
          const card = document.createElement("div");
          card.className =
            "rounded-xl border border-slate-200 bg-slate-50/40 p-3 transition focus-within:border-slate-400 focus-within:bg-white";

          const topRow = document.createElement("div");
          topRow.className = "mb-1.5 flex items-center justify-between gap-2";

          const leftGroup = document.createElement("div");
          leftGroup.className = "flex flex-1 items-center gap-2";

          const colorDot = document.createElement("span");
          colorDot.className = "h-2.5 w-2.5 shrink-0 rounded-full";
          colorDot.style.backgroundColor = subj.color;

          const nameInput = document.createElement("input");
          nameInput.type = "text";
          nameInput.value = subj.name;
          nameInput.ariaLabel = `Subject ${index + 1} name`;
          nameInput.placeholder = "Subject Name";
          nameInput.className =
            "w-full rounded-md border border-transparent bg-transparent px-1 py-0.5 text-sm font-semibold text-slate-800 transition hover:border-slate-200 focus:border-slate-300 focus:bg-white focus:outline-none";
          nameInput.addEventListener("input", (e) => {
            subj.name = e.target.value;
            renderDiaryCanvas();
          });

          leftGroup.appendChild(colorDot);
          leftGroup.appendChild(nameInput);
          topRow.appendChild(leftGroup);

          if (state.subjects.length > 1) {
            const removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.title = "Remove subject";
            removeBtn.className =
              "rounded-md px-1.5 py-0.5 text-xs text-slate-400 transition hover:bg-slate-100 hover:text-slate-700";
            removeBtn.textContent = "Remove";
            removeBtn.addEventListener("click", () => {
              state.subjects.splice(index, 1);
              renderSubjectInputs();
              renderDiaryCanvas();
            });
            topRow.appendChild(removeBtn);
          }

          const textarea = document.createElement("textarea");
          textarea.rows = 2;
          textarea.value = subj.diary;
          textarea.dir = "auto";
          textarea.placeholder = `Write ${subj.name || "subject"} diary...`;
          textarea.className =
            "w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm leading-relaxed text-slate-700 placeholder:text-slate-400 transition focus:border-slate-400 focus:outline-none";
          textarea.addEventListener("input", (e) => {
            subj.diary = e.target.value;
            updateFilledBadge();
            renderDiaryCanvas();
          });

          card.appendChild(topRow);
          card.appendChild(textarea);
          els.subjectsContainer.appendChild(card);
        });

        updateFilledBadge();
      }

      /**
       * Detects whether a string contains Arabic/Urdu script characters for proper alignment & line height.
       */
      function containsRtlScript(text) {
        return /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test(text);
      }

      /**
       * Renders the full, high-resolution Landscape Diary Image onto #diaryCanvas.
       * Features a distinct split-panel header, stacked subject header pills + clean
       * body text layout, Fraunces & Manrope English typography, and Gulzar Urdu script.
       */
      function renderDiaryCanvas(options = {}) {
        const { highlightEmptyWarning = false } = options;
        const canvas = els.diaryCanvas;
        const ctx = canvas.getContext("2d");

        const width = 1520;
        const outerMargin = 44;
        const cardPadX = 48;
        const contentWidth = width - outerMargin * 2;
        const innerWidth = contentWidth - cardPadX * 2;

        // Only include subjects that have non-empty diary text
        const populatedSubjects = state.subjects.filter((s) => s.diary.trim().length > 0);
        const hasEntries = populatedSubjects.length > 0;

        // Measure total height first using a unique stacked-header 2-column grid
        const measureCtx = document.createElement("canvas").getContext("2d");

        const colGap = 24;
        const rowGap = 20;
        const cardTopPad = 18;
        const cardBottomPad = 20;
        const headerStripH = 38;
        const headerToBodyGap = 14;
        const cardColW = (innerWidth - colGap) / 2;

        const measuredItems = populatedSubjects.map((item, idx) => {
          const isRtl = containsRtlScript(item.diary);
          const lineHeight = isRtl ? 40 : 30;
          measureCtx.font = isRtl
            ? '400 24px "Gulzar", serif'
            : '500 20px "Manrope", sans-serif';
          const textMaxW = cardColW - 44;
          const lines = wrapTextLines(measureCtx, item.diary.trim(), textMaxW);
          const safeLines = lines.length > 0 ? lines : [""];
          const rowHeight = Math.max(
            116,
            cardTopPad + headerStripH + headerToBodyGap + safeLines.length * lineHeight + cardBottomPad
          );
          return {
            ...item,
            serialNo: String(idx + 1).padStart(2, "0"),
            isRtl,
            lineHeight,
            lines: safeLines,
            rowHeight,
          };
        });

        // Pair items into landscape rows of 2 columns (or full width if single item)
        const gridRows = [];
        if (measuredItems.length === 1) {
          const single = measuredItems[0];
          const lineHeight = single.isRtl ? 40 : 30;
          measureCtx.font = single.isRtl
            ? '400 24px "Gulzar", serif'
            : '500 20px "Manrope", sans-serif';
          const fullTextMaxW = innerWidth - 48;
          const fullLines = wrapTextLines(measureCtx, single.diary.trim(), fullTextMaxW);
          const safeLines = fullLines.length > 0 ? fullLines : [""];
          const rowHeight = Math.max(
            116,
            cardTopPad + headerStripH + headerToBodyGap + safeLines.length * lineHeight + cardBottomPad
          );
          gridRows.push([{ ...single, lineHeight, lines: safeLines, rowHeight, isFullWidth: true }]);
        } else {
          for (let i = 0; i < measuredItems.length; i += 2) {
            const leftItem = measuredItems[i];
            const rightItem = measuredItems[i + 1] || null;
            const unifiedHeight = rightItem
              ? Math.max(leftItem.rowHeight, rightItem.rowHeight)
              : leftItem.rowHeight;
            gridRows.push([
              { ...leftItem, rowHeight: unifiedHeight, isFullWidth: false },
              rightItem ? { ...rightItem, rowHeight: unifiedHeight, isFullWidth: false } : null,
            ]);
          }
        }

        const subjectsBlockHeight = hasEntries
          ? gridRows.reduce((sum, pair) => sum + pair[0].rowHeight, 0) +
            Math.max(0, gridRows.length - 1) * rowGap
          : 124;

        const noteText = state.generalNote.trim();
        const noteIsRtl = containsRtlScript(noteText);
        const noteLineH = noteIsRtl ? 38 : 28;
        measureCtx.font = noteIsRtl
          ? '400 22px "Gulzar", serif'
          : '600 18.5px "Manrope", sans-serif';
        const noteLines = noteText ? wrapTextLines(measureCtx, noteText, innerWidth - 56) : [];
        const noteBoxHeight = noteLines.length > 0 ? 50 + noteLines.length * noteLineH : 0;

        // Balanced vertical spacing across unique split header, subject grid, and optional notice
        const headerHeight = 188;
        const sectionTitleHeight = 56;
        const bottomPad = 44;
        const totalHeight =
          outerMargin * 2 +
          headerHeight +
          sectionTitleHeight +
          subjectsBlockHeight +
          (noteBoxHeight > 0 ? noteBoxHeight + 24 : 0) +
          bottomPad;

        canvas.width = width;
        canvas.height = totalHeight;

        // 1. Outer Background Backdrop (Warm Alabaster & Soft Slate Canvas)
        const bgGrad = ctx.createLinearGradient(0, 0, width, totalHeight);
        bgGrad.addColorStop(0, "#E7ECEF");
        bgGrad.addColorStop(0.55, "#F4F6F8");
        bgGrad.addColorStop(1, "#E2E8F0");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, totalHeight);

        // Soft ambient accent wash in top-right & bottom-left
        ctx.save();
        ctx.globalAlpha = 0.055;
        ctx.fillStyle = "#0F172A";
        ctx.beginPath();
        ctx.arc(width - 60, 50, 230, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0284C7";
        ctx.beginPath();
        ctx.arc(60, totalHeight - 50, 230, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 2. Main Elevated Diary Sheet Card
        const sheetX = outerMargin;
        const sheetY = outerMargin;
        const sheetH = totalHeight - outerMargin * 2;

        ctx.save();
        ctx.shadowColor = "rgba(15, 23, 42, 0.08)";
        ctx.shadowBlur = 34;
        ctx.shadowOffsetY = 12;
        roundRectPath(ctx, sheetX, sheetY, contentWidth, sheetH, 26);
        ctx.fillStyle = "#FAFBFD";
        ctx.fill();
        ctx.restore();

        roundRectPath(ctx, sheetX, sheetY, contentWidth, sheetH, 26);
        ctx.strokeStyle = "#CBD5E1";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 3. Unique Split-Panel Header (Left Ivory Brand Zone + Right Deep Slate Meta Zone)
        const headerBandH = 168;
        const splitX = sheetX + contentWidth - 400;

        ctx.save();
        roundRectPath(ctx, sheetX + 1, sheetY + 1, contentWidth - 2, headerBandH, 25);
        ctx.clip();

        // Left header area: Crisp White
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(sheetX, sheetY, contentWidth, headerBandH);

        // Right header area: Deep Navy-Slate Panel with subtle accent border
        ctx.fillStyle = "#0F172A";
        ctx.fillRect(splitX, sheetY, contentWidth - (splitX - sheetX), headerBandH);

        // Thin vertical crimson & sky accent seam between left and right header panels
        ctx.fillStyle = "#DC2626";
        ctx.fillRect(splitX - 3, sheetY, 3, headerBandH);
        ctx.restore();

        let cursorY = sheetY + 26;
        const logoSize = 116;
        const logoX = sheetX + cardPadX;
        const logoY = cursorY;

        // Subtle ring behind logo
        ctx.save();
        ctx.beginPath();
        ctx.arc(logoX + logoSize / 2, logoY + logoSize / 2, logoSize / 2 + 4, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#E2E8F0";
        ctx.stroke();
        ctx.restore();

        const tempLogoCanvas = document.createElement("canvas");
        tempLogoCanvas.width = 280;
        tempLogoCanvas.height = 280;
        drawCampusLogo(tempLogoCanvas.getContext("2d"), 280, state.customLogoImg);
        ctx.drawImage(tempLogoCanvas, logoX, logoY, logoSize, logoSize);

        const textStartX = logoX + logoSize + 26;

        // Kicker Tag in Manrope uppercase tracking
        ctx.fillStyle = "#DC2626";
        ctx.font = '800 12px "Manrope", sans-serif';
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("DAILY DIARY EDITION", textStartX, cursorY + 4);

        // Editorial Display Title in Fraunces Serif
        ctx.fillStyle = "#0F172A";
        ctx.font = '800 29px "Fraunces", Georgia, serif';
        ctx.fillText("Superior Allama Iqbal Science College", textStartX, cursorY + 26);

        // Campus Location & Motto in Manrope
        ctx.fillStyle = "#475569";
        ctx.font = '600 17px "Manrope", sans-serif';
        ctx.fillText("Gojra Campus  •  Education With Excellence", textStartX, cursorY + 68);

        // Subtle horizontal rule under campus subtitle
        ctx.strokeStyle = "#E2E8F0";
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.moveTo(textStartX, cursorY + 101);
        ctx.lineTo(splitX - 28, cursorY + 101);
        ctx.stroke();

        // Right Dark Panel: Class & Date Readout with clean editorial hierarchy
        const activeClass = getActiveClassName();
        const formattedDate = formatDisplayDate(state.date);
        const metaLeftX = splitX + 28;
        const metaRightX = sheetX + contentWidth - cardPadX;

        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.font = '700 11.5px "Manrope", sans-serif';
        ctx.fillStyle = "#94A3B8";
        ctx.fillText("CLASS / SECTION", metaLeftX, cursorY + 22);

        ctx.font = '700 21px "Fraunces", Georgia, serif';
        ctx.fillStyle = "#FFFFFF";
        let displayClass = activeClass;
        while (ctx.measureText(displayClass).width > metaRightX - metaLeftX && displayClass.length > 4) {
          displayClass = displayClass.slice(0, -1);
        }
        ctx.fillText(displayClass, metaLeftX, cursorY + 46);

        // Divider line inside dark right panel
        ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(metaLeftX, cursorY + 69);
        ctx.lineTo(metaRightX, cursorY + 69);
        ctx.stroke();

        ctx.font = '700 11.5px "Manrope", sans-serif';
        ctx.fillStyle = "#38BDF8";
        ctx.fillText("PRESENT DATE", metaLeftX, cursorY + 88);

        ctx.font = '700 19.5px "Manrope", sans-serif';
        ctx.fillStyle = "#F8FAFC";
        ctx.fillText(formattedDate, metaLeftX, cursorY + 111);

        // Header bottom divider
        cursorY = sheetY + headerBandH + 1;
        ctx.strokeStyle = "#E2E8F0";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sheetX + 1, cursorY);
        ctx.lineTo(sheetX + contentWidth - 1, cursorY);
        ctx.stroke();

        // 4. Subjects Section Heading
        cursorY += 32;
        ctx.font = '800 15px "Fraunces", Georgia, serif';
        ctx.fillStyle = "#0F172A";
        ctx.textBaseline = "middle";
        ctx.fillText("Today's Subject Diary", sheetX + cardPadX, cursorY);

        if (hasEntries) {
          ctx.textAlign = "right";
          ctx.font = '700 12.5px "Manrope", sans-serif';
          ctx.fillStyle = "#64748B";
          ctx.fillText(
            `${populatedSubjects.length} ACTIVE SUBJECT${populatedSubjects.length > 1 ? "S" : ""}`,
            metaRightX,
            cursorY
          );
          ctx.textAlign = "left";
        } else if (highlightEmptyWarning) {
          ctx.textAlign = "right";
          ctx.font = '700 12.5px "Manrope", sans-serif';
          ctx.fillStyle = "#DC2626";
          ctx.fillText("Tip: Type subject diaries on the left first", metaRightX, cursorY);
          ctx.textAlign = "left";
        }

        cursorY += 22;

        // 5. Render Populated Subject Cards with Distinct Top Subject Bar + Full-Width Body
        if (!hasEntries) {
          roundRectPath(ctx, sheetX + cardPadX, cursorY, innerWidth, subjectsBlockHeight, 18);
          ctx.fillStyle = "#FFFFFF";
          ctx.fill();
          ctx.strokeStyle = "#CBD5E1";
          ctx.setLineDash([8, 6]);
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = '500 18px "Manrope", sans-serif';
          ctx.fillStyle = "#64748B";
          ctx.fillText(
            "Write diary entries in the subject fields on the left — only filled subjects will appear here.",
            sheetX + contentWidth / 2,
            cursorY + subjectsBlockHeight / 2
          );
          ctx.textAlign = "left";
          cursorY += subjectsBlockHeight + rowGap;
        } else {
          gridRows.forEach((pair) => {
            const rowH = pair[0].rowHeight;

            pair.forEach((item, colIdx) => {
              if (!item) return;

              const itemW = item.isFullWidth ? innerWidth : cardColW;
              const itemX = sheetX + cardPadX + (colIdx === 1 ? cardColW + colGap : 0);

              // Elevated white card
              ctx.save();
              ctx.shadowColor = "rgba(15, 23, 42, 0.04)";
              ctx.shadowBlur = 12;
              ctx.shadowOffsetY = 4;
              roundRectPath(ctx, itemX, cursorY, itemW, rowH, 18);
              ctx.fillStyle = "#FFFFFF";
              ctx.fill();
              ctx.restore();

              roundRectPath(ctx, itemX, cursorY, itemW, rowH, 18);
              ctx.strokeStyle = "#E2E8F0";
              ctx.lineWidth = 1.5;
              ctx.stroke();

              // Distinct Top Header Band inside each subject card
              const stripY = cursorY + cardTopPad;
              const stripX = itemX + 20;
              const stripW = itemW - 40;

              // Serial index badge + Subject Name pill
              const badgeW = 42;
              roundRectPath(ctx, stripX, stripY, badgeW, headerStripH, 10);
              ctx.fillStyle = item.badgeBg;
              ctx.fill();

              ctx.font = '800 13px "Manrope", sans-serif';
              ctx.fillStyle = item.color;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(item.serialNo, stripX + badgeW / 2, stripY + headerStripH / 2);

              ctx.textAlign = "left";
              ctx.font = '700 18px "Fraunces", Georgia, serif';
              ctx.fillStyle = "#0F172A";
              ctx.fillText(item.name.trim() || "Subject", stripX + badgeW + 12, stripY + headerStripH / 2 + 1);

              // Color accent dot on the right side of the card header strip
              ctx.beginPath();
              ctx.arc(stripX + stripW - 8, stripY + headerStripH / 2, 5, 0, Math.PI * 2);
              ctx.fillStyle = item.color;
              ctx.fill();

              // Delicate divider line below subject title strip
              const ruleY = stripY + headerStripH + 7;
              ctx.strokeStyle = "#F1F5F9";
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(stripX, ruleY);
              ctx.lineTo(stripX + stripW, ruleY);
              ctx.stroke();

              // Diary Body Text (Manrope for English, Gulzar for Urdu)
              const bodyStartY = ruleY + 14;
              ctx.textBaseline = "top";
              if (item.isRtl) {
                ctx.textAlign = "right";
                ctx.font = '400 24px "Gulzar", serif';
                ctx.fillStyle = "#0F172A";
                const rtlRightX = stripX + stripW;
                item.lines.forEach((line, idx) => {
                  ctx.fillText(line, rtlRightX, bodyStartY + idx * item.lineHeight);
                });
              } else {
                ctx.textAlign = "left";
                ctx.font = '500 20px "Manrope", sans-serif';
                ctx.fillStyle = "#1E293B";
                item.lines.forEach((line, idx) => {
                  ctx.fillText(line, stripX, bodyStartY + idx * item.lineHeight);
                });
              }
              ctx.textAlign = "left";
            });

            cursorY += rowH + rowGap;
          });
        }

        // 6. Optional Notice / Remarks Box
        if (noteLines.length > 0) {
          cursorY += 4;
          roundRectPath(ctx, sheetX + cardPadX, cursorY, innerWidth, noteBoxHeight, 16);
          ctx.fillStyle = "#FFFBEB";
          ctx.fill();
          ctx.strokeStyle = "#FDE68A";
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.font = '800 12px "Manrope", sans-serif';
          ctx.fillStyle = "#B45309";
          ctx.textBaseline = "top";
          ctx.fillText("PRINCIPAL / TEACHER NOTICE", sheetX + cardPadX + 24, cursorY + 14);

          ctx.font = noteIsRtl
            ? '400 22px "Gulzar", serif'
            : '600 18.5px "Manrope", sans-serif';
          ctx.fillStyle = "#78350F";
          if (noteIsRtl) {
            ctx.textAlign = "right";
            noteLines.forEach((line, idx) => {
              ctx.fillText(line, metaRightX - 24, cursorY + 36 + idx * noteLineH);
            });
            ctx.textAlign = "left";
          } else {
            noteLines.forEach((line, idx) => {
              ctx.fillText(line, sheetX + cardPadX + 24, cursorY + 36 + idx * noteLineH);
            });
          }
        }
      }

      /**
       * Loads the default logo.jpeg from the root directory with graceful fallback
       * to the built-in emblem if logo.jpeg is unavailable.
       */
      function loadDefaultRootLogo() {
        const defaultImg = new Image();
        defaultImg.onload = () => {
          state.customLogoImg = defaultImg;
          state.logoLabel = "logo.jpeg (Default)";
          els.logoSourceLabel.textContent = state.logoLabel;
          refreshLogoCanvases();
          renderDiaryCanvas();
        };
        defaultImg.onerror = () => {
          state.customLogoImg = null;
          state.logoLabel = "Default Emblem (logo.jpeg not found)";
          els.logoSourceLabel.textContent = state.logoLabel;
          refreshLogoCanvases();
          renderDiaryCanvas();
        };
        defaultImg.src = "logo.jpeg";
      }

      /**
       * Binds UI events and initializes application state.
       */
      function init() {
        els.diaryDate.value = state.date;
        els.diaryClass.value = state.classSelection;
        els.generalNote.value = state.generalNote;

        refreshLogoCanvases();
        renderSubjectInputs();
        renderDiaryCanvas();
        loadDefaultRootLogo();

        // Date change
        els.diaryDate.addEventListener("change", (e) => {
          state.date = e.target.value;
          renderDiaryCanvas();
        });

        // Class selection change
        els.diaryClass.addEventListener("change", (e) => {
          state.classSelection = e.target.value;
          if (state.classSelection === "CUSTOM") {
            els.customClassInput.classList.remove("hidden");
            els.customClassInput.focus();
          } else {
            els.customClassInput.classList.add("hidden");
          }
          renderDiaryCanvas();
        });

        // Custom class text input
        els.customClassInput.addEventListener("input", (e) => {
          state.customClass = e.target.value;
          renderDiaryCanvas();
        });

        // General notice input
        els.generalNote.addEventListener("input", (e) => {
          state.generalNote = e.target.value;
          renderDiaryCanvas();
        });

        // Add custom subject row
        els.btnAddSubject.addEventListener("click", () => {
          const palette = ACCENT_PALETTE[state.subjects.length % ACCENT_PALETTE.length];
          const newIndex = state.subjects.length + 1;
          state.subjects.push({
            id: `subj-${Date.now()}-${newIndex}`,
            name: `Subject ${newIndex}`,
            color: palette.color,
            badgeBg: palette.badgeBg,
            diary: "",
          });
          renderSubjectInputs();
          renderDiaryCanvas();
          showToast(`Added Subject ${newIndex} field.`, "info");
        });

        // Upload custom campus logo
        els.logoUploadInput.addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              state.customLogoImg = img;
              state.logoLabel = `Uploaded: ${file.name}`;
              els.logoSourceLabel.textContent = state.logoLabel;
              refreshLogoCanvases();
              renderDiaryCanvas();
              showToast("Campus logo updated!", "success");
            };
            img.onerror = () => {
              showToast("Unable to read selected image file.", "warn");
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });

        // Reset logo to default root logo.jpeg
        els.btnResetLogo.addEventListener("click", () => {
          els.logoUploadInput.value = "";
          loadDefaultRootLogo();
          showToast("Restored default logo.jpeg.", "info");
        });

        // Create Diary Image button
        els.btnCreateDiary.addEventListener("click", () => {
          const hasFilled = state.subjects.some((s) => s.diary.trim().length > 0);
          renderDiaryCanvas({ highlightEmptyWarning: !hasFilled });
          els.diaryCanvas.scrollIntoView({ behavior: "smooth", block: "nearest" });
          if (hasFilled) {
            showToast("Diary image created! Click 'Download PNG' to save.", "success");
          } else {
            showToast("Write diary text in at least one subject field first.", "warn");
          }
        });

        // Download buttons
        els.btnDownloadDiary.addEventListener("click", downloadDiaryImage);
        els.btnDownloadSecondary.addEventListener("click", downloadDiaryImage);

        // Sample & Clear buttons
        els.btnLoadSample.addEventListener("click", loadSampleDiary);
        els.btnClearAll.addEventListener("click", clearAllEntries);
      }

      /**
       * Downloads the generated diary canvas as a crisp PNG file.
       */
      function downloadDiaryImage() {
        const hasFilled = state.subjects.some((s) => s.diary.trim().length > 0);
        if (!hasFilled) {
          renderDiaryCanvas({ highlightEmptyWarning: true });
          showToast("Please enter at least one subject diary before downloading.", "warn");
          return;
        }

        renderDiaryCanvas();
        try {
          const dataUrl = els.diaryCanvas.toDataURL("image/png");
          const safeClass = getActiveClassName().replace(/[^a-zA-Z0-9_-]+/g, "_");
          const safeDate = state.date || getTodayISO();
          const link = document.createElement("a");
          link.download = `Diary_${safeClass}_${safeDate}.png`;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("Diary PNG downloaded!", "success");
        } catch (err) {
          showToast("Unable to export image. Check if logo.jpeg is from another domain.", "warn");
        }
      }

      /**
       * Populates sample diary entries for quick testing.
       */
      function loadSampleDiary() {
        state.subjects.forEach((subj) => {
          if (SAMPLE_DIARIES[subj.name]) {
            subj.diary = SAMPLE_DIARIES[subj.name];
          }
        });
        state.generalNote = "Monthly test starts Monday. Bring complete practical notebooks.";
        els.generalNote.value = state.generalNote;
        renderSubjectInputs();
        renderDiaryCanvas();
        showToast("Sample diary loaded.", "info");
      }

      /**
       * Clears all subject entries and general notice.
       */
      function clearAllEntries() {
        state.subjects.forEach((subj) => {
          subj.diary = "";
        });
        state.generalNote = "";
        els.generalNote.value = "";
        renderSubjectInputs();
        renderDiaryCanvas();
        showToast("All entries cleared.", "info");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
